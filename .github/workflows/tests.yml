name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Existing service tests
        run: python -m pytest tests/ -q
      - name: API startup and entry points
        run: >-
          python -c "from fastapi.testclient import TestClient; from backend.app import app;
          c=TestClient(app);
          assert c.get('/').status_code == 200;
          assert c.get('/docs').status_code == 200;
          assert c.get('/openapi.json').status_code == 200;
          print('API entry points passed')"
