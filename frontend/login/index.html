<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sign in · Vellum</title>
  <link rel="stylesheet" href="../assets/css/tailwind.css">
  <link rel="stylesheet" href="./login.css">
  <script type="module" src="./login.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="app-header"></div>
  <main id="main-content" class="workspace login-shell" tabindex="-1">
    <div class="page-heading">
      <h1>Sign in</h1>
      <p class="page-intro">Select a persona to explore the clinical OPD workflow.</p>
    </div>
    <div id="login-notice" class="login-notice" aria-live="polite"></div>
    <p id="session-check" class="status" role="status"><span class="status-dot" aria-hidden="true"></span>Checking your session…</p>
    <section id="demo-account-panel" class="demo-panel" aria-label="Demo accounts" hidden>
      <div id="demo-accounts" class="demo-account-list"></div>
      <p class="field-help demo-account-note">All accounts and clinical records in this demo environment are synthetic.</p>
    </section>
    <noscript><p class="page-intro">JavaScript is needed to sign in and use this application. Ask hospital staff for assistance.</p></noscript>
  </main>
</body>
</html>
